name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINTELLIEMU_STANDALONE=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: freeintv_libretro-linux-${{ github.sha }}
        path: build/freeintv_libretro.so
